[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-unme"
version = "0.1.0"
description = "Lab UnMe: legitimate open-weight distillation pipeline (Kimi K3 → UnMe student)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lab UnMe" }]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
  "orjson>=3.9",
  "tenacity>=8.0",
  "numpy>=1.26",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.44",
  "datasets>=2.20",
  "accelerate>=0.33",
  "peft>=0.12",
  "trl>=0.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
unme = "unme.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
